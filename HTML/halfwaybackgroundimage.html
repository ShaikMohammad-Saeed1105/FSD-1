<html>
    <head>
    <title>
        Fixed Image
    </title>
    <style>
        body{
            background-image: url("C:/FSD-1/HTML/batman.jpg");
            background-repeat: no-repeat;
            width: 100%;
            height: 100%;
            background-position: center;
            background-attachment: fixed;
            transform: rotateX(20deg);
            scroll-margin-right: inherit;
            scroll-behavior: smooth;
        }
        p{
            background-color: aliceblue;
            font-size: 50;
        }
        div{
            background-color: antiquewhite;
            font-size: 45;

        }
        h2{
            background-color: aliceblue;
            font-size: 40;
        }
    </style>
    </head>
    <body>
        <p>In this program i used:<br></p>
        
          <div> <ul>
            <li>
                background-image
            </li>
            <li>
                background-repeat is no-repeat
            </li>
            <li>
                background-attachment is fixed
            </li>
            
           </ul>
           </div>
        <h2>Scroll Down to understand the consept of fixed Background image</h2>
        
    </body>
</html>
