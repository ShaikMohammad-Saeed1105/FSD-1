<html>
    <head>
        <title>
            Registration Form
        </title>
    </head>
    <style>
        input[type="checkbox"]{
            width: 15px;
            height: 15px;
            margin-right: 10px;
            appearance: auto;
        }
        
    </style>
    <body>
        <center><h2>Student Registration Form</h2></center>
        <div>
            <center>
            <form>
                <table>
                    <tr>
                        <td>Name:</td>
                        <td><input type="text" name = "name"></td>
                    </tr>
                    <tr>
                        <td>Roll No:</td>
                        <td><input type="text" name = "Roll No"></td>
                    </tr>
                    <tr>
                        <td>Phone Number:</td>
                        <td><input type="tel"name="phone"pattern="[0-9]{10}"placeholder="Enter 10-digit number"></td>
                    </tr>
                    <tr>
                        <td>Age:</td>
                        <td><input type="number" name = "Age"></td>
                    </tr>
                    <tr>
                        <td>Date of birth:</td>
                        <td><input type="date"name = "DoB"></td>
                    </tr>
                    <tr>
                        <td>Gender:</td>
                        <td><input type= "radio"name = "gender">Male<input type= "radio" name = "gender">Female</td>
                    </tr>
                    <tr>
                        <td>Select Event to participate:</td>
                        <td>
                            
                                <input type ="checkbox" name= "event" value = "clubs">Clubs<br>
                            
                                <input type ="checkbox" id= "techevents" value= "Tech Events"> Tech Events<br>
                            
                                <input type ="checkbox" name= "event" value = "Sports">Sports
                        </td>
                        
                    </tr>
                    <tr>
                        <td>Department:</td>
                        <td>
                            <select placeholder="Choose">
                                <option placeholder="Choose">Select</option>
                                <option>CIC</option>
                                <option>AIDS</option>
                                <option>CSM</option>
                                <option>CAI</option>
                                <option>CSE</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>College Name:</td>
                        <td><textarea rows="1" cols="10"></textarea></td>
                    </tr>
                    <tr>
                        <td text-align ="center" ><input type = "submit" value = "Submit"></td>
                        <td text-align = "center"><input type = "reset" value = "Reset"></td>
                    </tr>
            </table>
            
    </form>
    </center>
    </div>
    </body>
</html>
